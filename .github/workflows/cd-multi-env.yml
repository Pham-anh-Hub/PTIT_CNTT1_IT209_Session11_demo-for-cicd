name: CD Multi-Environment Deployment

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.example.com

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Triển khai lên môi trường Staging
        run: |
          echo "=========================================="
          echo " BẮT ĐẦU TRIỂN KHAI LÊN MÔI TRƯỜNG STAGING"
          echo "=========================================="
          echo " Môi trường: staging"
          echo " Commit SHA: ${{ github.sha }}"
          echo " Địa chỉ ứng dụng: https://staging.example.com"
          echo " Triển khai STAGING hoàn tất thành công!"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.prod.example.com

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Triển khai lên môi trường Production
        run: |
          echo "============================================="
          echo " BẮT ĐẦU TRIỂN KHAI LÊN MÔI TRƯỜNG PRODUCTION"
          echo "============================================="
          echo " Môi trường: production (Đã được phê duyệt thủ công)"
          echo " Commit SHA: ${{ github.sha }}"
          echo " Địa chỉ ứng dụng: https://api.prod.example.com"
          echo " Triển khai PRODUCTION hoàn tất thành công!"



