name: Deploy Spring Boot Container to Remote VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Thiết lập Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cấp quyền thực thi cho Gradle Wrapper
        run: chmod +x gradlew

      - name: Đóng gói tệp JAR với Gradle
        run: ./gradlew bootJar

      - name: Đăng nhập vào GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trích xuất metadata cho Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đóng gói và đẩy Docker Image lên GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-vps:
    name: Deploy Container to VPS via SSH
    needs: build-image
    runs-on: ubuntu-latest

    steps:
      - name: Thực thi câu lệnh triển khai trên VPS qua SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "============================================="
            echo "BẮT ĐẦU QUY TRÌNH TRIỂN KHAI TRÊN VPS"
            echo "============================================="
            
            IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}:latest" | tr '[:upper:]' '[:lower:]')
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo " Đang kéo Image: $IMAGE_NAME..."
            docker pull $IMAGE_NAME
            
            echo "🔄 Dọn dẹp container cũ..."
            docker stop app || true
            docker rm app || true
            
            echo " Khởi chạy container mới trên cổng 8080..."
            docker run -d \
              --name app \
              -p 8080:8080 \
              --restart unless-stopped \
              $IMAGE_NAME
            
            echo " TRIỂN KHAI LÊN VPS HOÀN TẤT THÀNH CÔNG!"
            docker ps --filter "name=app"
